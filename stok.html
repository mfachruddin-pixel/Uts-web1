<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Katalog & Keranjang Buku</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="nav-menu" style="display: flex; justify-content: space-between; align-items: center;">
        <div>
            <a href="dashboard.html">Dashboard</a>
            <a href="stok.html" style="color: #a7f3d0;">Informasi Stok</a>
            <a href="pemesanan.html">Form Pemesanan</a>
            <a href="tracking.html">Tracking Resi</a>
        </div>
        <div>
            <button id="btnDarkMode"
                style="background-color: #334155; color: white; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-weight: bold;">🌙
                Dark Mode</button>
        </div>
    </div>

    <div class="container card">
        <h2>Katalog Buku & Stok</h2>

        <!-- Kotak Pencarian Buku -->
        <div style="margin: 15px 0;">
            <input type="text" id="inputCari" placeholder="🔍 Cari berdasarkan nama atau kode barang...">
        </div>

        <!-- Tabel Katalog Buku -->
        <table id="tabelKatalog">
            <thead>
                <tr>
                    <th>No</th>
                    <th>Cover</th>
                    <th>Kode</th>
                    <th>Nama Buku</th>
                    <th>Edisi</th>
                    <th>Stok</th>
                    <th>Harga</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="bodyKatalog">
                <!-- Dirender JavaScript -->
            </tbody>
        </table>

        <!-- BAGIAN KERANJANG BELANJA -->
        <div style="margin-top: 40px; border-top: 2px dashed #cbd5e1; padding-top: 20px;">
            <h2>🛒 Keranjang Belanja Anda</h2>
            <table id="tabelKeranjang">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Nama Buku</th>
                        <th>Harga Satuan</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="bodyKeranjang">
                    <tr>
                        <td colspan="4" style="text-align: center; color: #64748b;">Keranjang masih kosong. Silakan klik
                            "Beli" pada buku di atas.</td>
                    </tr>
                </tbody>
            </table>

            <div style="margin-top: 15px; display: flex; justify-content: space-between; align-items: center;">
                <h3 id="totalHargaBelanja">Total: Rp 0</h3>
                <button id="btnCheckout" style="background-color: #059669; padding: 12px 24px;">Checkout
                    Sekarang</button>
            </div>
        </div>

        <!-- Form Tambah Stok via DOM -->
        <form id="formTambahStok"
            style="background: #f0fdf4; padding: 15px; border-radius: 5px; margin-top: 30px; border: 1px solid #d1fae5;">
            <h3>Tambah Buku Baru (Admin)</h3>
            <input type="text" id="kodeBarang" placeholder="Kode Barang (ex: BUKU01)" required>
            <input type="text" id="namaBarang" placeholder="Nama Barang" required>
            <input type="text" id="jenisBarang" placeholder="Jenis Barang" required>
            <input type="text" id="edisiBuku" placeholder="Edisi" required>
            <input type="number" id="jumlahStok" placeholder="Jumlah Stok" required>
            <input type="text" id="hargaBuku" placeholder="Harga (angka saja, ex: 100000)" required>
            <button type="submit">Tambah ke Katalog</button>
        </form>
    </div>

    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
