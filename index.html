<!-- index.html -->
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Login - Toko Buku Online</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container card" style="max-width: 400px; margin-top: 10%;">
        <h2 style="text-align: center;">Login Sistem</h2>
        <form id="loginForm">
            <label>Email:</label>
            <input type="email" id="email" required placeholder="Gunakan: fachruddin@mhs...">
            <label>Password:</label>
            <input type="password" id="password" required placeholder="Password: 123">
            <button type="submit" style="width: 100%;">Login</button>
        </form>
        <div style="text-align: center; margin-top: 15px;">
            <button class="btn-secondary" id="btnLupaPassword">Lupa Password</button>
            <button class="btn-secondary" id="btnDaftar">Daftar</button>
        </div>
    </div>

    <!-- Modal Lupa Password -->
    <div id="modalLupaPassword" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Reset Password</h2>
            <input type="email" placeholder="Masukkan Email Anda">
            <button>Kirim Link Reset</button>
        </div>
    </div>

    <!-- Modal Daftar -->
    <div id="modalDaftar" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Pendaftaran Akun</h2>
            <input type="text" placeholder="Nama Lengkap">
            <input type="email" placeholder="Email">
            <input type="password" placeholder="Password">
            <button>Daftar Sekarang</button>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
